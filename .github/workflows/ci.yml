name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Verificação de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: um segredo removido depois continua vazado
      - name: Instalar gitleaks (versão fixa, checksum conferido)
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Procurar segredos no histórico e na árvore de trabalho
        run: |
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --verbose .
          ./gitleaks dir --config .gitleaks.toml --redact --exit-code 1 --verbose .

  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: freenfse
          POSTGRES_USER: freenfse
          POSTGRES_PASSWORD: senha-efemera-do-ci # banco descartável do job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freenfse -d freenfse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Valores fictícios, válidos só neste job.
      SECRET_KEY: chave-ficticia-somente-para-o-ci
      POSTGRES_DB: freenfse
      POSTGRES_USER: freenfse
      POSTGRES_PASSWORD: senha-efemera-do-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ferramentas do backup (pg_dump da série 18, igual ao servidor, e age)
        working-directory: .
        run: |
          # O pg_dump precisa ser da mesma série (ou mais nova) que o servidor do job (18).
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (formatação)
        run: ruff format --check .
      - name: ruff (instalador)
        working-directory: .
        run: |
          # Config própria (alvo py310): o instalador roda com o Python do servidor, não com o 3.14 do backend.
          ruff check --config instalador/ruff.toml instalador
          ruff format --check --config instalador/ruff.toml instalador
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest

  instalador:
    name: Instalador (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 é o mínimo declarado (instalador/freenfse_instalador/versao.py); 3.12 é o do Ubuntu 24.04;
        # 3.14 é o do backend. O instalador roda com o Python do SERVIDOR (issue #30).
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet pytest==9.2.0 # a mesma versão do backend/requirements-dev.txt
      - name: Testes do instalador (inclui versão mínima e quebras de linha)
        working-directory: instalador
        run: python -m pytest

  frontend:
    name: Frontend (eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose (aplicação vazia sobe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Gerar .env efêmero (valores aleatórios, descartados com o job)
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')|" .env
          sed -i "s|^FREENFSE_CHAVES=.*|FREENFSE_CHAVES=1:$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')|" .env
      - name: Subir a pilha
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: /api/versao/ responde pelo Nginx com a versão do arquivo VERSION
        run: |
          resposta=$(curl -fsS http://localhost:8080/api/versao/)
          echo "${resposta}"
          test "${resposta}" = "{\"versao\":\"$(cat VERSION)\"}"
      - name: Interface é servida
        run: curl -fsS http://localhost:8080/ | grep -q '<title>freenfse</title>'
      - name: Autenticação (allauth) responde pelo Nginx
        run: |
          curl -fsS http://localhost:8080/_allauth/browser/v1/config | grep -q '"status": *200'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/_allauth/browser/v1/auth/session)" = "401"
      - name: Rotas protegidas recusam quem não está autenticado
        run: |
          # sem login: a API de empresa responde 401 e a de administração, 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/qualquer/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/eu/)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin-global/empresas/)" = "403"
          # rotas de cadastros e fiscal são de empresa: sem login, 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/cadastros/pessoas/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/fiscal/identidade/)" = "401"
      - name: Municípios do IBGE foram carregados na subida
        run: |
          docker compose exec -T backend python manage.py shell -c \
            "import sys; from core.models import Municipio; sys.exit(0 if Municipio.objects.count() == 5571 else 1)"
      - name: Primeiro Master é criado pela linha de comando
        run: |
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')" \
            backend python manage.py createsuperuser --noinput --email master@example.com --nome Master
      - name: Worker Celery está de pé
        run: docker compose exec -T worker celery -A config inspect ping
      - name: Saúde (banco, Redis, worker, agendador) responde pelo Nginx
        run: |
          resposta=$(curl -fsS http://localhost:8080/api/saude/)
          echo "${resposta}"
          echo "${resposta}" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["status"] in ("ok","degradado"), d; assert d["banco"]=="ok" and d["redis"]=="ok" and d["worker"]=="ok", d'
      - name: Dados cifrados em repouso (nenhum valor em claro)
        run: docker compose exec -T backend python manage.py verificar_cifragem
      - name: Backend fora do ar mostra erro em linguagem simples
        run: |
          docker compose stop backend worker beat
          resposta=$(curl -s -w '\n%{http_code}' http://localhost:8080/api/versao/)
          echo "${resposta}"
          test "$(echo "${resposta}" | tail -1)" = "503"
          echo "${resposta}" | grep -q '"codigo":"indisponivel"'
          curl -s http://localhost:8080/accounts/google/login/ | grep -q "O sistema está indisponível"
      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar
        if: always()
        run: docker compose down --volumes
