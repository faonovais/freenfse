<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Arquivo grande demais — freenfse</title>
<style>
  :root { color-scheme: light dark; --fundo:#f7f7f8; --texto:#1b1b1f; --suave:#55555c; --destaque:#1f5f8b; --cartao:#fff; --borda:#dcdce0; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#16161a; --texto:#ececf0; --suave:#a8a8b2; --destaque:#7fb8e0; --cartao:#1f1f25; --borda:#34343c; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--fundo); color:var(--texto);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:32rem; background:var(--cartao); border:1px solid var(--borda); border-radius:12px; padding:28px; }
  h1 { font-size:1.35rem; margin:0 0 12px; }
  p { margin:0 0 12px; color:var(--suave); }
  a.botao { display:inline-block; margin-top:8px; padding:10px 18px; border-radius:8px; background:var(--destaque); color:var(--fundo);
            text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>O arquivo é grande demais</h1>
  <p>O limite é de 20 MB. O certificado digital e o logotipo da empresa costumam ter bem menos que isso.</p>
  <p><strong>O que fazer:</strong> confira se escolheu o arquivo certo e, se for uma imagem, reduza o tamanho antes de enviar.</p>
  <a class="botao" href="/">Voltar ao sistema</a>
</main>
</body>
</html>
