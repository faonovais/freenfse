# Baseado nos padrões de Nginx da Topo: X-Forwarded-Proto preservado, DNS do
# backend re-resolvido e bloqueio de /media/. O restante é específico do freenfse.
#
# Serve a SPA React e faz proxy de /api/ para o backend Django (Gunicorn).

# Preserva o X-Forwarded-Proto recebido de uma borda à frente que já terminou o
# TLS; só assume $scheme quando o cabeçalho não veio. Sobrescrever sempre com
# $scheme faz o Django ver "http" atrás de uma borda HTTPS e entrar em loop de
# redirecionamento. Só use o cabeçalho de clientes quando houver essa borda.
map $http_x_forwarded_proto $proto_encaminhado {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite de upload (certificado A1 e logo entram em fases posteriores): são
    # arquivos pequenos, então 20m bastam.
    client_max_body_size 20m;

    server_tokens off;

    # Cabeçalhos de segurança. Não use add_header dentro de location: isso
    # descarta os cabeçalhos definidos aqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: repassa ao Gunicorn.
    location /api/ {
        # Re-resolve o IP do backend pelo DNS interno do Docker a cada poucos
        # segundos; sem isso o Nginx fixa o IP no boot e devolve 502 quando o
        # contêiner do backend é recriado.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_encaminhado;
        proxy_read_timeout 120s;
        # O Nginx é a fonte única destes cabeçalhos; evita duplicá-los com os do Django.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
    }

    # Mídia (logos e demais arquivos por empresa) NUNCA é servida direto pelo
    # Nginx: o download passa autenticado pelo backend, restrito à empresa do
    # usuário. O 404 explícito evita cair na regra da SPA (que responderia o
    # index.html com 200) e não depende da ordem das locations.
    location /media/ {
        return 404;
    }

    # Arquivos com hash no nome e fontes: cache longo.
    location /assets/ {
        expires 1y;
    }

    location /fonts/ {
        expires 1y;
    }

    # SPA: qualquer outra rota cai no index.html, sempre revalidado.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
