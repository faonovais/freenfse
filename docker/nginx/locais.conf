# Trechos comuns ao servidor HTTP e ao HTTPS do freenfse (incluído dentro de "server { }").
# Quem inclui define listen, server_name, root, index e "location /erros/".

server_tokens off;

# Limite de upload (certificado A1 e logo): são arquivos pequenos, então 20m bastam.
client_max_body_size 20m;

# Cabeçalhos de segurança. Não use add_header dentro de location: isso descarta os cabeçalhos
# definidos aqui.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Páginas de erro em linguagem simples (só para erros gerados pelo próprio Nginx; as respostas
# de erro do sistema, em JSON, passam sem alteração).
error_page 413 /erros/arquivo-grande.html;
error_page 500 502 503 504 /erros/indisponivel.html;

# API e autenticação da SPA (JSON): repassa ao Gunicorn. Se o sistema estiver fora do ar, a
# resposta também é JSON, no mesmo formato dos erros do sistema ({codigo, detalhe}).
location ~ ^/(api|_allauth)/ {
    include /etc/nginx/freenfse/proxy.conf;
    error_page 502 503 504 = @api_indisponivel;
    error_page 413 = @api_arquivo_grande;
}

# Retorno (callback) do login social: navegação do navegador, então erro em página HTML.
location ^~ /accounts/ {
    include /etc/nginx/freenfse/proxy.conf;
}

location @api_indisponivel {
    default_type application/json;
    return 503 '{"codigo":"indisponivel","detalhe":"O sistema está indisponível por alguns instantes. Aguarde um minuto e tente de novo."}';
}

location @api_arquivo_grande {
    default_type application/json;
    return 413 '{"codigo":"arquivo_grande","detalhe":"O arquivo é grande demais. O limite é de 20 MB."}';
}

# Mídia (logos e demais arquivos por empresa) NUNCA é servida direto pelo Nginx: o download
# passa autenticado pelo backend, restrito à empresa do usuário. O 404 explícito evita cair na
# regra da SPA (que responderia o index.html com 200) e não depende da ordem das locations.
location /media/ {
    return 404;
}

# Arquivos com hash no nome e fontes: cache longo.
location /assets/ {
    expires 1y;
}

location /fonts/ {
    expires 1y;
}

# SPA: qualquer outra rota cai no index.html, sempre revalidado.
location / {
    try_files $uri /index.html;
    expires -1;
}
