# Repasse ao backend (Gunicorn) no Docker Compose; incluído dentro de cada "location".

# Re-resolve o IP do backend pelo DNS interno do Docker a cada poucos segundos; sem isso o Nginx
# fixa o IP no boot e devolve 502 quando o contêiner do backend é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream backend:8000;
proxy_pass http://$backend_upstream;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $proto_encaminhado;
proxy_read_timeout 120s;
# O Nginx é a fonte única destes cabeçalhos; evita duplicá-los com os do Django.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
