# Servidor HTTP (porta 80) do freenfse: serve a SPA React e faz proxy de /api/, /_allauth/ e
# /accounts/ para o backend Django (Gunicorn). Os trechos comuns estão em locais.conf; o HTTPS é
# gerado pelo instalador (docker/nginx/tls.conf.modelo).

# Preserva o X-Forwarded-Proto recebido de uma borda à frente que já terminou o
# TLS; só assume $scheme quando o cabeçalho não veio. Sobrescrever sempre com
# $scheme faz o Django ver "http" atrás de uma borda HTTPS e entrar em loop de
# redirecionamento. Só use o cabeçalho de clientes quando houver essa borda.
map $http_x_forwarded_proto $proto_encaminhado {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Desafio HTTP-01 do Let's Encrypt (o instalador monta esta pasta quando há certificado).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Páginas de erro (só alcançáveis por error_page).
    location /erros/ {
        internal;
        alias /usr/share/nginx/erros/;
    }

    include /etc/nginx/freenfse/locais.conf;
}
